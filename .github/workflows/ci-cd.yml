name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './rental-backend/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd rental-backend
          npm ci

      - name: Run backend tests
        run: |
          cd rental-backend
          npm test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './rental-frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd rental-frontend
          npm ci

      - name: Build frontend
        run: |
          cd rental-frontend
          npm run build

  build-docker-images:
    name: Build Docker Images (Validation)
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./rental-backend
          file: ./rental-backend/Dockerfile
          push: false # Do not push, just validate the build
          tags: rental-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./rental-frontend
          file: ./rental-frontend/Dockerfile
          push: false # Do not push, just validate the build
          tags: rental-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
